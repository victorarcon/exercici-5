name: exercici5
on:
  push:
    branches: [ test ]

jobs:
  compile-test-linux:
    runs-on: ubuntu-latest

  steps:
    -name: checkout
    uses: actions/checkout@v6

    -name: Ejecutar makefile
    run: make conversor.c

    -name: Comprobar
    run: ./conversor c2f 100

  compile-test-mac:
    runs-on: macos-latest

  steps:
    -name: checkout
    uses: actions/checkout@v6

    -name: Ejecutar makefile
    run: make conversor.c

    -name: Comprobar
    run: ./conversor c2f 100
